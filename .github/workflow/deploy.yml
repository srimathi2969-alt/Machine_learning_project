name: Student Prediction API CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate API
        run: python -c "import app; print('API validation successful')"

      - name: Deploy to Render
        if: success()
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"